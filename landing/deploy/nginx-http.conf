# ─────────────────────────────────────────────────────────────────────────────
# Again Cleaner — landing, HTTP-only variant
#
# Use this for the FIRST deploy, before TLS certificates exist:
#   1. Deploy dist/ to /var/www/againcleaner/dist
#   2. Enable this config, then issue certs:
#        certbot certonly --webroot -w /var/www/certbot -d againcleaner.mediarise.org
#   3. Switch to the full nginx.conf (HTTPS) and reload.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name againcleaner.mediarise.org;

    root /var/www/againcleaner/dist;
    index index.html;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security headers (reduced set — HSTS only makes sense over HTTPS)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.dmg$ {
        types { }
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment";
        expires 1h;
        sendfile on;
        tcp_nopush on;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

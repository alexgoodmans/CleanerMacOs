# ─────────────────────────────────────────────────────────────────────────────
# Again Cleaner — landing (Vite/React SPA) nginx template
#
# Usage:
#   1. Build the site:            npm run build   (output goes to dist/)
#   2. Copy dist/ to the server:  /var/www/againcleaner/dist
#   3. Put the .dmg next to it:   /var/www/againcleaner/dist/Again-Cleaner.dmg
#   4. Adjust server_name / paths / certificates below.
#   5. Symlink into sites-enabled and reload:
#        ln -s /etc/nginx/sites-available/againcleaner.conf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# ── DDoS / abuse protection ──────────────────────────────────────────────────
# Zones live at http{} level (this file is included there).
#
#  dl_req   — how often one IP may *start* a .dmg download (10/min is plenty
#             for a human retrying; bots hammering the file get 429).
#  dl_conn  — parallel .dmg connections per IP (blocks parallel-chunk abuse).
#  site_req — general page/asset rate for the rest of the site.
limit_req_zone  $binary_remote_addr zone=dl_req:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=dl_conn:10m;
limit_req_zone  $binary_remote_addr zone=site_req:10m rate=10r/s;

# Return 429 (Too Many Requests) instead of the default 503 so real users
# understand what happened and CDNs don't cache the error.
limit_req_status  429;
limit_conn_status 429;

# ── Cloudflare (recommended first line of defence) ───────────────────────────
# If you proxy the domain through Cloudflare (orange cloud), uncomment this
# block so rate limiting sees the real client IP instead of Cloudflare's.
# Current ranges: https://www.cloudflare.com/ips/
#
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;
# set_real_ip_from 2803:f800::/32;
# set_real_ip_from 2405:b500::/32;
# set_real_ip_from 2405:8100::/32;
# set_real_ip_from 2a06:98c0::/29;
# set_real_ip_from 2c0f:f248::/32;
# real_ip_header CF-Connecting-IP;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name againcleaner.mediarise.org;

    # ACME challenge for certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name againcleaner.mediarise.org;

    root /var/www/againcleaner/dist;
    index index.html;

    # ── TLS (certbot paths — adjust to your setup) ───────────────────────────
    ssl_certificate     /etc/letsencrypt/live/againcleaner.mediarise.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/againcleaner.mediarise.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    # ── Vite build artifacts: content-hashed, cache forever ──────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Icons and other static files in the site root
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── App download (.dmg) ──────────────────────────────────────────────────
    # The heavy bytes live in S3; nginx only answers a cheap 302. The rate
    # limit still applies so bots can't hammer even the redirect, and the
    # site URL stays stable (/Again-Cleaner.dmg) if the bucket ever moves.
    location = /Again-Cleaner.dmg {
        limit_req  zone=dl_req burst=5 nodelay;
        limit_conn dl_conn 3;
        return 302 https://s3.ru1.storage.beget.cloud/c73d0519b315-mr-s3/again-cleaner/Again-Cleaner.dmg;
    }

    # Fallback: serve the .dmg from this server instead of S3.
    # Delete the redirect above and uncomment this block to go local.
    #location ~* \.dmg$ {
    #    limit_req  zone=dl_req burst=5 nodelay;
    #    limit_conn dl_conn 3;
    #    limit_rate_after 1m;   # first MB fast (page feels snappy)…
    #    limit_rate 4m;         # …then cap per-connection bandwidth
    #    types { }
    #    default_type application/x-apple-diskimage;
    #    add_header Content-Disposition "attachment";
    #    expires 1h;
    #    sendfile on;
    #    tcp_nopush on;
    #}

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # index.html must never be cached so deploys go live immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        limit_req zone=site_req burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Shed slow-loris connections quickly.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  16k;   # the site accepts no uploads

    # Deny dotfiles (except the ACME dir handled on :80)
    location ~ /\. {
        deny all;
    }
}

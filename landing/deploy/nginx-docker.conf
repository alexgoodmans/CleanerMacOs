# ─────────────────────────────────────────────────────────────────────────────
# Again Cleaner — landing, containerised variant (see ../Dockerfile).
#
# Differences from the bare-metal nginx.conf next to this file:
#   • no TLS block and no HTTP→HTTPS redirect — the reverse proxy in front
#     (Traefik in Coolify) terminates HTTPS and speaks plain HTTP to us;
#   • no /.well-known/acme-challenge — the proxy owns certificate issuance;
#   • real_ip_* added, because behind the proxy every request would otherwise
#     arrive from the same container IP and the rate limits below would throttle
#     all visitors as if they were one client;
#   • root is /usr/share/nginx/html (image layout), not /var/www.
# Everything else — caching, security headers, .dmg redirect, limits — matches.
# ─────────────────────────────────────────────────────────────────────────────

# ── DDoS / abuse protection ──────────────────────────────────────────────────
#  dl_req   — how often one IP may *start* a .dmg download.
#  dl_conn  — parallel .dmg connections per IP (blocks parallel-chunk abuse).
#  site_req — general page/asset rate for the rest of the site.
limit_req_zone  $binary_remote_addr zone=dl_req:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=dl_conn:10m;
limit_req_zone  $binary_remote_addr zone=site_req:10m rate=10r/s;

# 429 instead of the default 503: real users understand it and CDNs don't cache it.
limit_req_status  429;
limit_conn_status 429;

# ── Real client IP ───────────────────────────────────────────────────────────
# Trust the Docker networks the proxy sits on. Without this every request looks
# like it comes from Traefik and the limits above become a global throttle.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name againcleaner.com www.againcleaner.com;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    include /etc/nginx/conf.d/security-headers.inc;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;   # everything reaches us proxied; without this gzip is skipped
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    # Container health probe (Dockerfile HEALTHCHECK). Kept out of the access log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Vite build artifacts: content-hashed, cache forever ──────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }

    # Icons and other static files in the site root
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }

    # ── App download (.dmg) ──────────────────────────────────────────────────
    # The heavy bytes live in S3; nginx only answers a cheap 302, but the rate
    # limit still applies so bots can't hammer even the redirect.
    #
    # nginx gotcha: a bare `return` runs in the rewrite phase, BEFORE limit_req
    # fires — so the redirect must live in a named location reached via
    # try_files, which runs after the limits have been enforced.
    location = /Again-Cleaner.dmg {
        limit_req  zone=dl_req burst=5 nodelay;
        limit_conn dl_conn 3;
        try_files /.__s3_redirect @s3_dmg;
    }

    location @s3_dmg {
        return 302 https://s3.ru1.storage.beget.cloud/c73d0519b315-mr-s3/again-cleaner/Again-Cleaner.dmg;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # index.html must never be cached so deploys go live immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location / {
        limit_req zone=site_req burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Shed slow-loris connections quickly.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  16k;   # the site accepts no uploads

    location ~ /\. {
        deny all;
    }
}
